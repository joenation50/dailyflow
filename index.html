<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DailyFlow</title>
    <meta name="description" content="DailyFlow is a personal planner and focus dashboard for busy people." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="authView" class="auth-shell">
      <div class="auth-card">
        <div class="brand-wrap auth-brand">
          <div class="brand-mark">DF</div>
          <div>
            <p class="eyebrow">Personal planner</p>
            <h1>DailyFlow</h1>
          </div>
        </div>

        <div class="auth-toggle">
          <button class="toggle-btn active" data-auth-tab="login">Login</button>
          <button class="toggle-btn" data-auth-tab="signup">Sign up</button>
        </div>

        <form id="loginForm" class="auth-form visible">
          <input id="loginEmail" type="email" placeholder="Email address" required />
          <input id="loginPassword" type="password" placeholder="Password" required />
          <button type="submit" class="primary-btn full">Log in</button>
        </form>

        <form id="signupForm" class="auth-form hidden">
          <input id="signupEmail" type="email" placeholder="Email address" required />
          <input id="signupPassword" type="password" placeholder="Password" required />
          <button type="submit" class="primary-btn full">Create account</button>
        </form>

        <p id="authMessage" class="auth-message"></p>
      </div>
    </div>

    <div id="appView" class="app-shell hidden">
      <aside class="sidebar">
        <div class="brand-wrap">
          <div class="brand-mark">DF</div>
          <div>
            <p class="eyebrow">Personal plan</p>
            <h1>DailyFlow</h1>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-item active">Overview</button>
          <button class="nav-item">Today</button>
          <button class="nav-item">Planner</button>
          <button class="nav-item">Notes</button>
        </nav>

        <div class="mini-card">
          <p class="eyebrow">Focus</p>
          <h3 id="focus-title">3 priorities</h3>
          <ul id="focus-list" class="tiny-list"></ul>
        </div>

        <button id="logoutBtn" class="secondary-btn full logout-btn">Log out</button>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Good morning</p>
            <h2 id="today-label">Monday, 1 Jan</h2>
          </div>
          <button class="primary-btn" id="quick-add-btn">+ Quick add</button>
        </header>

        <section class="stats-grid" id="stats-grid">
          <article class="stats-card accent">
            <span>Tasks today</span>
            <strong id="today-count">0</strong>
          </article>
          <article class="stats-card">
            <span>Upcoming</span>
            <strong id="upcoming-count">0</strong>
          </article>
          <article class="stats-card">
            <span>Completed</span>
            <strong id="completed-count">0</strong>
          </article>
          <article class="stats-card">
            <span>Focus score</span>
            <strong id="focus-score">0%</strong>
          </article>
        </section>

        <section class="content-grid">
          <div class="panel main-panel-card">
            <div class="section-header">
              <h3>Add task</h3>
            </div>

            <form id="taskForm" class="task-form">
              <input id="taskTitle" type="text" placeholder="What needs to be done?" required />

              <div class="input-row">
                <select id="taskPriority">
                  <option value="high">High priority</option>
                  <option value="medium" selected>Medium</option>
                  <option value="low">Low</option>
                </select>

                <input id="taskDate" type="date" />
              </div>

              <div class="input-row">
                <select id="taskCategory">
                  <option value="work">Work</option>
                  <option value="personal">Personal</option>
                  <option value="study">Study</option>
                  <option value="health">Health</option>
                </select>

                <select id="taskRecurrence">
                  <option value="none" selected>One-time</option>
                  <option value="daily">Daily</option>
                  <option value="weekly">Weekly</option>
                  <option value="monthly">Monthly</option>
                </select>
              </div>

              <button type="submit" class="primary-btn full">Save task</button>
            </form>
          </div>

          <div class="panel main-panel-card">
            <div class="section-header">
              <h3>Quick notes</h3>
            </div>

            <form id="noteForm" class="note-form">
              <textarea id="noteInput" rows="4" placeholder="Capture a thought, idea, or reminder..."></textarea>
              <button type="submit" class="secondary-btn full">Add note</button>
            </form>
          </div>
        </section>

        <section class="lists-grid">
          <div class="panel list-panel">
            <div class="section-header">
              <h3>Today’s focus</h3>
            </div>
            <ul id="todayList" class="task-list"></ul>
          </div>

          <div class="panel list-panel">
            <div class="section-header">
              <h3>Upcoming</h3>
            </div>
            <ul id="upcomingList" class="task-list"></ul>
          </div>

          <div class="panel list-panel full-width">
            <div class="section-header">
              <h3>This week</h3>
            </div>
            <ul id="weekList" class="task-list"></ul>
          </div>

          <div class="panel list-panel full-width">
            <div class="section-header">
              <h3>Notes</h3>
            </div>
            <ul id="notesList" class="note-list"></ul>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
